name: Update Weather Datas 

on:
    schedule:
        - cron: '0 */6 * * *'
    workflow_dispatch:
    push:
        branches: ["main"]

permissions:
    contents: write
    pages: write
    id-token: write
jobs:
    build:
        runs-on: ubuntu-latest 

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
      
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.10'
      
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install requests pandas
      
            - name: Run weather extraction script
              run: python scripts/extract_weather.py
      
            - name: Commit and Push changes
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                
                git add src/_data/weather.json
                
                # This line checks if there are changes. If no changes, it skips the commit.
                if git diff --staged --quiet; then
                echo "No changes to weather data. Skipping push."
                else
                git commit -m "Automated weather data update"
                    git push
                    fi