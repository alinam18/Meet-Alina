name: Update Weather Datas 

on:
    schedule:
        - cron: '0 */6 * * *'
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest 

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
      
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.10'
      
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install requests pandas
      
            - name: Run weather extraction script
              run: python scripts/extract_weather.py
      
            - name: Commit and push changes
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git add src/_data/weather.json
                # Only commit if the file actually changed to avoid empty commits
                git diff --quiet && git diff --staged --quiet || (git commit -m "Automated weather data update" && git push)
