name: Update Weather and Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: ["main"] # This ensures manual code changes also trigger a deploy

permissions:
  contents: write
  pages: write      # Required for deploying to Pages
  id-token: write   # Required for deploying to Pages

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run weather extraction script
        run: python scripts/extract_weather.py

      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/weather.json
          if git diff --staged --quiet; then
            echo "No changes to weather data. Skipping commit."
          else
            git commit -m "Automated weather data update"
            git push
          fi

      # --- NEW STEPS FOR OPTION 1 ---

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Eleventy dependencies
        run: npm install

      - name: Build Eleventy Site
        run: npx @11ty/eleventy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site # Change this if your output folder is named differently

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4